<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VitalGuard</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><span class="brand">VitalGuard</span><p>Vitals monitoring prototype</p></div><button onclick="critical()">Simulate Critical</button></header><section class="metrics"><div><small>Heart Rate</small><b id="hr">—</b></div><div><small>SpO₂</small><b id="spo2">—</b></div><div><small>Risk</small><b id="risk">—</b></div></section><section class="panel"><h2>Record Vitals</h2><div class="form"><input id="patient" placeholder="Patient name" value="Demo Patient"><input id="hrin" type="number" placeholder="Heart rate"><input id="spoin" type="number" step="0.1" placeholder="SpO₂"><input id="temp" type="number" step="0.1" placeholder="Temperature"><input id="sys" type="number" placeholder="Systolic"><input id="dia" type="number" placeholder="Diastolic"><button onclick="submitVitals()">Record</button></div></section><section class="panel"><h2>Alert History</h2><div id="alerts"></div></section></main><script src="app.js"></script></body></html>
